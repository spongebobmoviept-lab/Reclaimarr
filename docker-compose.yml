services:
  reclaimarr:
    image: ghcr.io/spongebobmoviept-lab/reclaimarr:1.2.0   # ready-made image (amd64 + arm64)
    # build: https://github.com/spongebobmoviept-lab/Reclaimarr.git#v1.2.0   # build from source instead: uncomment, then `docker compose up -d --build`
    container_name: reclaimarr
    restart: unless-stopped
    # Runs as this uid:gid (the image never runs as root). ./data must be
    # writable by it — create it yourself first: mkdir -p data
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8585:8585"
    env_file:
      - path: .env
        required: false   # optional: everything is set in the web setup page
    volumes:
      - ./data:/data
      # IMPORTANT — change the left side of the line below to wherever your
      # movie library actually lives on THIS machine. It must be the exact
      # same path your Radarr already uses internally (check a movie's file
      # path in Radarr's UI) — Reclaimarr matches files by path, so if this
      # doesn't line up, nothing will work.
      #
      # Examples:
      #   - /mnt/media/Movies:/media2       (a mounted NAS share)
      #   - /home/you/Movies:/media2        (a local folder)
      - /path/to/your/movies:/media2
      #
      # Movies spread over more than one root folder in Radarr? Mount each
      # one at the same container path Radarr uses, and list them all in
      # MEDIA_ROOTS in your .env (e.g. MEDIA_ROOTS=/media2,/media4). Each root
      # gets its own reclaimarr-vault folder for preserved originals.
      #   - /path/to/more/movies:/media4
      #
      # Optional: share a folder with another qBittorrent queue manager so it
      # can see which torrents Reclaimarr force-started (set
      # QBIT_ACTIVE_HASHES_FILE=/shared/qbit/reclaimarr_active_hashes.json).
      #   - ./shared:/shared/qbit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8585/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
